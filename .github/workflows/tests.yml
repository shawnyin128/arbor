name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    # The launcher is a polyglot read by both cmd.exe and POSIX shells, and its
    # failure mode is a silent exit 0. Only a matrix catches that: a Windows-only
    # run never exercises the shell branch, and a Linux-only run never exercises
    # the batch branch.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Configure git for fixtures
        # Fixtures build real repositories, and a runner has no global identity.
        run: |
          git config --global user.email "arbor@example.invalid"
          git config --global user.name "Arbor CI"
          git config --global init.defaultBranch master

      - name: Run the suite
        run: python -m pytest

      - name: Verify the suite catches deliberate regressions
        run: python tests/mutations.py

      - name: Confirm the launcher kept LF endings
        # .gitattributes pins this; a checkout that converted it would make the
        # shell branch fail its interpreter probe and exit 0 with no output.
        shell: python
        run: |
          from pathlib import Path
          data = Path("plugins/arbor/hooks/arbor-hook.cmd").read_bytes()
          assert b"\r" not in data, "launcher gained carriage returns on checkout"
          print("launcher is LF-only")
